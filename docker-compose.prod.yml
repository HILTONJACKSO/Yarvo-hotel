version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
#  Yarvo Hotel PMS — Production Docker Compose
#  Domain: YOUR_DOMAIN.com  (update below before deploying)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: yarvo-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yarvo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-yarvo}
    volumes:
      - yarvo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yarvo} -d ${POSTGRES_DB:-yarvo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yarvo_net

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: yarvo-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --loglevel warning
    volumes:
      - yarvo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yarvo_net

  # ── API (NestJS) ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: yarvo-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      API_HOST: 0.0.0.0
      FRONTEND_URL: ${FRONTEND_URL:-http://72.61.15.24:3050}
      DATABASE_URL: postgresql://${POSTGRES_USER:-yarvo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yarvo}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      COOKIE_SECRET: ${COOKIE_SECRET}
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://72.61.15.24:3050,http://localhost:3000}
      RATE_LIMIT_TTL: 60000
      RATE_LIMIT_MAX: 100
      AUTH_RATE_LIMIT_TTL: 900000
      AUTH_RATE_LIMIT_MAX: 10
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: ./uploads
      LOG_LEVEL: info
      LOG_FORMAT: json
      SWAGGER_ENABLED: "false"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      HOTEL_EMAIL: ${HOTEL_EMAIL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      PUBLIC_API_KEY: ${PUBLIC_API_KEY}
    ports:
      - "${API_PORT:-3051}:3001"
    volumes:
      - yarvo_uploads:/app/uploads
    networks:
      - yarvo_net

  # ── Web (Next.js) ────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://72.61.15.24:3051}
    container_name: yarvo-web
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://72.61.15.24:3051}
      NEXT_PUBLIC_APP_NAME: "Yarvo Hotel PMS"
      INTERNAL_API_URL: http://api:3001
      PUBLIC_API_KEY: ${PUBLIC_API_KEY}
      PORT: 3000
    ports:
      - "${WEB_PORT:-3050}:3000"
    networks:
      - yarvo_net

volumes:
  yarvo_postgres_data:
  yarvo_redis_data:
  yarvo_uploads:

networks:
  yarvo_net:
    driver: bridge
