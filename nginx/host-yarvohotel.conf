server {
    server_name yarvohotel.com www.yarvohotel.com;

    # ── Security: Hide Server Tokens & OS Fingerprinting ───────────────────────
    server_tokens off;

    # ── HTTP/2 DoS Mitigation (Rapid Reset Protection) ─────────────────────────
    http2_max_concurrent_streams 128;
    keepalive_requests 1000;
    client_body_timeout 15s;
    client_header_timeout 15s;
    client_max_body_size 50M;

    # ── Modern Security Headers ────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # ── Prevent Unsafe HTTP Methods on Frontend ────────────────────────────────
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── Static Next.js Cache ───────────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3050;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    # ── RFC 9116 Security.txt ──────────────────────────────────────────────────
    location /.well-known/security.txt {
        proxy_pass http://127.0.0.1:3050;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Backend API Routes ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3051;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Frontend Next.js Web Application ───────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/yarvohotel.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/yarvohotel.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name api.yarvohotel.com;

    server_tokens off;
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3051;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    if ($host = www.yarvohotel.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = yarvohotel.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name yarvohotel.com www.yarvohotel.com;
    return 404; # managed by Certbot
}
